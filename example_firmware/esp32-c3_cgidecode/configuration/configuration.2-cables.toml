# (2) USB cable option. Build with CDCOnBoot=default into build-2/.
# GDBMiner configuration for ESP32-C3-DevKitM-1 cgidecode adapter.
# Paper replica (Eisele et al. 2025, Section 5.4) of stm32_cgidecode:
# same percent_encode library, entry point, seeds and (empty) ignore list.
[BASIC]
# The authors' seeds and evaluation corpus, unchanged.
seed_directory = "./example_firmware/stm32_cgidecode/seeds"
output_directory = "./output/esp32-c3_cgidecode/"
binary_file = "./example_firmware/esp32-c3_cgidecode/build-2/esp32-c3_cgidecode.ino.elf"
eval_directory = "./example_firmware/stm32_cgidecode/eval"

[Connection]
input_channel = "esp32-uart"
port = "/dev/cu.usbserial-110"
baud_rate = 9600
rts = true
reset_pulse = true

[GDB]
gdb_path = "~/Library/Arduino15/packages/esp32/tools/riscv32-esp-elf-gdb/17.1_20260402/bin/riscv32-esp-elf-gdb"
instance = "esp32c3"
# Requires the separate USB-JTAG link; the DevKitM-1 Micro-USB port is UART-only.
# 40 MHz is the USB-JTAG base clock used in the recorded runs.
# ESP_FLASH_SIZE 0: every breakpoint is a hardware breakpoint, so one that finds no free trigger
# fails instead of being written into flash. OpenOCD then also skips its reset at GDB attach.
gdb_server_path = '''~/.espressif/openocd-esp32/bin/openocd
  -c "set ESP_RTOS none"
  -c "set ESP_FLASH_SIZE 0"
  -f board/esp32c3-builtin.cfg
  -c "gdb port {gdb_port}"
  -c "telnet port {telnet_port}"
  -c "tcl port {tcl_port}"
  -c "adapter serial {adapter_serial}"
  -c "adapter speed 40000"'''
gdb_port = 3333

# Same as stm32_cgidecode: nothing is skipped, so all eight trigger slots are available.
watchpoint_type = "(char*)"
watchpoint_count = 8
timeout = 30
entrypoint = "percent::decode"
input_buffer = "buf"

[GDB.esp32c3]
# Symbols for code already in mask ROM, loaded alongside firmware symbols, not flashed.
# Match the chip revision: the recorded v1.1 board uses esp32c3_rev101_rom.elf.
rom_elf = "~/.espressif/tools/esp-rom-elfs/20241011/esp32c3_rev101_rom.elf"
# No finish or exit breakpoint: observe bytes with slots 0-7.
hardware_trigger_slot = 0
# The serial EN pulse already restarts firmware before GDB connects.
reset_on_connect = false

[LOGS]
log_level = "INFO"
