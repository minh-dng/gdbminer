# GDBMiner configuration for ESP32-C3-DevKitM-1 cgidecode adapter.
# Paper replica (Eisele et al. 2025, Section 5.4) of stm32_cgidecode:
# same percent_encode library, entry point, seeds and (empty) ignore list.
[BASIC]
seed_directory = ./example_firmware/esp32-c3_cgidecode/seeds
output_directory = ./output/esp32-c3_cgidecode/
binary_file = ./example_firmware/esp32-c3_cgidecode/build/esp32-c3_cgidecode.ino.elf
eval_directory = ./example_firmware/esp32-c3_cgidecode/eval

[Connection]
input_channel = esp32-serial
port = /dev/cu.usbserial-110
baud_rate = 9600
rts = true
reset_pulse = true
boot_delay = 3

[GDB]
gdb_path = /Users/dan173/Library/Arduino15/packages/esp32/tools/riscv32-esp-elf-gdb/17.1_20260402/bin/riscv32-esp-elf-gdb
# ROM symbols for the connected chip revision (v1.1), as for json.
rom_elf = /Users/dan173/.espressif/tools/esp-rom-elfs/20241011/esp32c3_rev101_rom.elf
instance = esp32c3
# Requires a JTAG route. DevKitM-1 micro-USB is UART-only (CP2102N).
# 40 MHz is the USB-JTAG base clock.
gdb_server_path = /Users/dan173/.espressif/openocd-esp32/bin/openocd -s /Users/dan173/.espressif/openocd-esp32/share/openocd/scripts -c "set ESP_RTOS none" -f board/esp32c3-builtin.cfg -c "adapter serial A0:F2:62:01:70:28" -c "adapter speed 40000"
gdb_server_address = :3333

# Same as stm32_cgidecode: nothing is skipped, so no finish breakpoints are
# needed and all eight shared trigger slots observe input bytes.
ignore_functions_regex =
watchpoint_type = (char*)
watchpoint_count = 8
hardware_trigger_slot = 0
dwt_function_reg = 0
dwt_watchpoint_workaround = false
reset_on_connect = false
timeout = 30
entrypoint = percent::decode
exitpoint =
input_buffer = buf

[LOGS]
log_level = INFO
