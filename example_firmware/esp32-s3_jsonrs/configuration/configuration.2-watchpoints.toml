# Two watchpoints (faster option): DBREAK0 and DBREAK1, half the runs for seeds over 6 bytes.
# DBREAK1 is shared with the firmware's FreeRTOS stack guard; the adapter checks it after every
# step. One USB cable. Build with CDCOnBoot=cdc,USBMode=hwcdc,LoopCore=0 into build/.
# GDBMiner configuration for the Waveshare ESP32-S3-Zero jsonrs target.
# Extension of the embedded evaluation: the desktop Rust parser (tinyjson) and its corpus.
[BASIC]
# The corpora named by the desktop jsonrs configuration (the json directories), unchanged.
seed_directory = "./example_programs/json/seeds"
output_directory = "./output/esp32-s3_jsonrs-2-watchpoints/"
binary_file = "./example_firmware/esp32-s3_jsonrs/build/esp32-s3_jsonrs.ino.elf"
eval_directory = "./example_programs/json/eval"

[Connection]
input_channel = "esp32-usb-serial-jtag"
# CDC port of the native USB-Serial/JTAG device; OpenOCD uses its JTAG function.
port = ""
rts = true
reset_pulse = true

[GDB]
gdb_path = "~/Library/Arduino15/packages/esp32/tools/xtensa-esp-elf-gdb/17.1_20260402/bin/xtensa-esp32s3-elf-gdb"
instance = "esp32s3"
# The same native USB link as the inputs. ESP_ONLYCPU 1: debug core 0, which runs loop()
# (LoopCore=0); with both cores, OpenOCD hands GDB whichever core it polls first after a halt.
# ESP_FLASH_SIZE 0: every breakpoint is a hardware breakpoint, so a third one fails instead of
# rewriting flash. 40 MHz is the USB-JTAG base clock used in the recorded runs.
gdb_server_path = '''~/.espressif/openocd-esp32/bin/openocd
  -c "set ESP_RTOS none"
  -c "set ESP_ONLYCPU 1"
  -c "set ESP_FLASH_SIZE 0"
  -f board/esp32s3-builtin.cfg
  -c "gdb port {gdb_port}"
  -c "telnet port {telnet_port}"
  -c "tcl port {tcl_port}"
  -c "adapter serial {adapter_serial}"
  -c "adapter speed 40000"'''
gdb_port = 3333

# The desktop jsonrs rule (skip every function whose name lacks "json") with three additions.
# The hardware backends drop reads that happen inside a skipped function, and tinyjson reads the
# input only through core::iter::adapters::peekable (peek, next), core::str::iter (Chars::next) and
# core::str::validations (next_code_point), none of whose names contain "json", so
# those stay traced. The wrapper `parser` stays traced so that returning from jsonrs_parse reaches
# the expected caller. Everything else (malloc, fmt, the Arduino runtime) is skipped with finish.
ignore_functions_regex = "^((?!json|parser|peekable|core::str::(iter|validations)).)*$"
# The ESP32-S3 GDB 17.1 aborts when it prints the argument of a Rust function it stopped at the
# entry of (is_whitespace); the arguments are left out of the trace.
frame_arguments = "none"
# As on the desktop: no cast and the entry function's argument, so the watch expression
# (`&data[3]`) parses in the Rust frame. The C++ global `buf` that `data` points to is not
# visible there.
watchpoint_type = ""
# Both data breakpoints (DBREAK), separate from the two instruction breakpoints.
watchpoint_count = 2
timeout = 30
entrypoint = "jsonrs_parse"
input_buffer = "data"

[GDB.esp32s3]
# A halt names one DBREAK, so the two watched bytes must not share an aligned word.
watchpoint_min_distance = 4
# Symbols for code already in mask ROM, loaded alongside firmware symbols, not flashed.
# Chip revision v0.2 uses the rev0 ROM: esp32s3_rev0_rom.elf covers all v0.x chips.
rom_elf = "~/.espressif/tools/esp-rom-elfs/20241011/esp32s3_rev0_rom.elf"
# Must be false: after OpenOCD's reset the USB device re-enumerates and the input port fails.
# The serial reset pulse restarts the firmware instead.
reset_on_connect = false
# If OpenOCD cannot open the USB device, reset this board's USB port and attach again.
usb_reset_command = "uv run scripts/esp32_usb_reset.py --serial {adapter_serial}"

[LOGS]
log_level = "INFO"
