# GDBMiner configuration for ESP32-C3-DevKitM-1 json adapter.
# Paper replica (Eisele et al. 2025, Section 5.4) of stm32_arduinojson:
# same library, entry point, seeds and ignore list; raw hardware read triggers.
# Do not mix these outputs with any custom-parser traces or grammars.
[BASIC]
seed_directory = ./example_firmware/esp32-c3_json/seeds
output_directory = ./output/esp32-c3_json/
binary_file = ./example_firmware/esp32-c3_json/build/esp32-c3_json.ino.elf
eval_directory = ./example_firmware/esp32-c3_json/eval

[Connection]
input_channel = esp32-serial
port = /dev/cu.usbserial-110
baud_rate = 9600
rts = true
reset_pulse = true
boot_delay = 3

[GDB]
gdb_path = /Users/dan173/Library/Arduino15/packages/esp32/tools/riscv32-esp-elf-gdb/17.1_20260402/bin/riscv32-esp-elf-gdb
# ROM symbols for the connected chip revision (v1.1). strlen, memset and the
# soft-float helpers run from mask ROM; without symbols they have no names for
# ignore_functions_regex to match.
rom_elf = /Users/dan173/.espressif/tools/esp-rom-elfs/20241011/esp32c3_rev101_rom.elf
instance = esp32c3
# Requires a JTAG route. DevKitM-1 micro-USB is UART-only (CP2102N).
# 40 MHz is the USB-JTAG base clock; same trace as 1 MHz, 15% faster.
gdb_server_path = /Users/dan173/.espressif/openocd-esp32/bin/openocd -s /Users/dan173/.espressif/openocd-esp32/share/openocd/scripts -c "set ESP_RTOS none" -f board/esp32c3-builtin.cfg -c "adapter serial A0:F2:62:01:70:28" -c "adapter speed 40000"
gdb_server_address = :3333

# stm32_arduinojson list; __aeabi_dadd is the ARM EABI name of libgcc __adddf3.
ignore_functions_regex = malloc|free|_strtod_l|__adddf3|__floatdidf|__floatundidf|strlen|memset
watchpoint_type = (char*)
# Eight shared trigger slots. GDB's finish inserts two hardware breakpoints
# (return address, C++ exception hook), so slots 0-1 stay free for OpenOCD.
watchpoint_count = 6
hardware_trigger_slot = 2
dwt_function_reg = 0
dwt_watchpoint_workaround = false
reset_on_connect = false
timeout = 30
# Same parser-library boundary as stm32_arduinojson.
entrypoint = cJSON_Parse
exitpoint =
input_buffer = buf

[LOGS]
log_level = INFO
