# (2) USB cable option. Build with CDCOnBoot=default.
# GDBMiner configuration for ESP32-C3-DevKitM-1 json adapter.
# Paper replica (Eisele et al. 2025, Section 5.4) of stm32_arduinojson:
# same library, entry point, seeds and ignore list; raw hardware read triggers.
# Do not mix these outputs with any custom-parser traces or grammars.
[BASIC]
seed_directory = "./example_firmware/esp32-c3_json/seeds"
output_directory = "./output/esp32-c3_json/"
binary_file = "./example_firmware/esp32-c3_json/build/esp32-c3_json.ino.elf"
eval_directory = "./example_firmware/esp32-c3_json/eval"

[Connection]
input_channel = "esp32-uart"
port = "/dev/cu.usbserial-110"
baud_rate = 9600
rts = true
reset_pulse = true

[GDB]
gdb_path = "/Users/dan173/Library/Arduino15/packages/esp32/tools/riscv32-esp-elf-gdb/17.1_20260402/bin/riscv32-esp-elf-gdb"
instance = "esp32c3"
# Requires the separate USB-JTAG link; the DevKitM-1 Micro-USB port is UART-only.
# 40 MHz is the USB-JTAG base clock used in the recorded runs.
gdb_server_path = '''/Users/dan173/.espressif/openocd-esp32/bin/openocd
  -s /Users/dan173/.espressif/openocd-esp32/share/openocd/scripts
  -c "set ESP_RTOS none"
  -f board/esp32c3-builtin.cfg
  -c "adapter serial A0:F2:62:01:70:28"
  -c "adapter speed 40000"'''
gdb_server_address = ":3333"

# STM32 ignore list; __aeabi_dadd is the ARM EABI name of libgcc __adddf3.
ignore_functions_regex = "malloc|free|_strtod_l|__adddf3|__floatdidf|__floatundidf|strlen|memset"
watchpoint_type = "(char*)"
watchpoint_count = 6
timeout = 30
entrypoint = "cJSON_Parse"
input_buffer = "buf"

[GDB.esp32c3]
# Symbols for code already in mask ROM, loaded alongside firmware symbols, not flashed.
# Match the chip revision: the recorded v1.1 board uses esp32c3_rev101_rom.elf.
rom_elf = "/Users/dan173/.espressif/tools/esp-rom-elfs/20241011/esp32c3_rev101_rom.elf"
# GDB finish needs slots 0-1 for its return and C++ exception-hook breakpoints.
hardware_trigger_slot = 2
# The serial EN pulse already restarts firmware before GDB connects.
reset_on_connect = false

[LOGS]
log_level = "INFO"
